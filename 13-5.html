<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>24001010303 唐翊斌的下图标</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #f5f5f5;
            padding-bottom: 60px;
            width: 100%;
        }

        .tang_top {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 44px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            font-weight: 600;
            border-bottom: 1px solid #eee;
            z-index: 100;
        }

        .tang_top .tang_home-link {
            position: absolute;
            left: 12px;
            font-size: 14px;
            color: #a45c53;
            text-decoration: none;
        }

        .tang_content {
            padding-top: 44px;
            width: 100%;
            min-height: calc(100vh - 44px);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 14px;
        }

        .tang_tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 56px;
            background: #fff;
            display: flex;
            border-top: 1px solid #eee;
            z-index: 100;
        }

        .tang_tab-item {
            flex: 1 1 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
        }

        .tang_tab-icon {
            width: 24px;
            height: 24px;
            display: block;
        }

        .tang_tab-item .tang_tab-icon--on {
            display: none;
        }

        .tang_tab-item.active .tang_tab-icon--on {
            display: block;
        }

        .tang_tab-item.active .tang_tab-icon--off {
            display: none;
        }

        .tang_tab-label {
            font-size: 10px;
            color: #8e8c8d;
            margin-top: 2px;
            transition: color 0.2s;
        }

        .tang_tab-item.active .tang_tab-label {
            color: #a45c53;
        }

        .tang_badge {
            position: absolute;
            top: 3px;
            left: 50%;
            margin-left: 4px;
            min-width: 16px;
            height: 16px;
            padding: 0 4px;
            background: #ff3b30;
            border-radius: 8px;
            font-size: 10px;
            font-style: normal;
            line-height: 16px;
            text-align: center;
            color: #fff;
        }

        .tang_dot {
            position: absolute;
            top: 5px;
            left: 50%;
            margin-left: 8px;
            width: 8px;
            height: 8px;
            background: #ff3b30;
            border-radius: 50%;
        }
    </style>
