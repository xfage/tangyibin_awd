    }

    }

    .tang_event-subject a {

      text-decoration: none;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.2s;
    }

    .tang_event-subject a:hover {

    }

    .tang_event-image {
      display: block;
      flex-shrink: 0;
    }

    .tang_event-image img {
      display: block;
      width: 95px;
      height: 128px;
      object-fit: cover;
      border-radius: 2px;
    }

    @media (max-width: 768px) {
      .tang_row {
