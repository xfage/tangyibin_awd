<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>CSS3 3D 动画</title>
<style>
  .tang_body {
    font-family: "Microsoft YaHei", sans-serif;
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #1a1a2e;
    color: #eee;
    overflow: hidden;
  }
  .tang_h1 { font-size: 28px; margin-bottom: 40px; }
  .tang_scene {
    width: 200px;
    height: 200px;
    perspective: 600px;
    margin: 30px;
  }
  .tang_cube {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    animation: tang_spin 6s linear infinite;
  }
  .tang_face {
    position: absolute;
    width: 200px;
    height: 200px;
    border: 2px solid rgba(255,255,255,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: bold;
    backface-visibility: visible;
  }
  .tang_front  { background: rgba(230, 106, 61, 0.7);  transform: rotateY(0deg) translateZ(100px); }
  .tang_back   { background: rgba(33, 90, 112, 0.7);   transform: rotateY(180deg) translateZ(100px); }
  .tang_right  { background: rgba(76, 175, 80, 0.7);   transform: rotateY(90deg) translateZ(100px); }
  .tang_left   { background: rgba(156, 39, 176, 0.7);  transform: rotateY(-90deg) translateZ(100px); }
  .tang_top    { background: rgba(255, 193, 7, 0.7);   transform: rotateX(90deg) translateZ(100px); }
  .tang_bottom { background: rgba(0, 150, 136, 0.7);   transform: rotateX(-90deg) translateZ(100px); }

  @keyframes tang_spin {
    from { transform: rotateX(0deg) rotateY(0deg); }
    to   { transform: rotateX(360deg) rotateY(360deg); }
  }

  .tang_card-scene {
    width: 200px;
    height: 280px;
    perspective: 800px;
    margin: 30px;
  }
  .tang_card {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.8s ease;
    cursor: pointer;
  }
  .tang_card-scene:hover .tang_card { transform: rotateY(180deg); }
  .tang_card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    backface-visibility: hidden;
    font-size: 18px;
  }
  .tang_card-front {
    background: linear-gradient(135deg, #e66a3d, #c44d28);
    color: #fff;
  }
  .tang_card-back {
    background: linear-gradient(135deg, #215a70, #173f4f);
    color: #fff;
    transform: rotateY(180deg);
  }

  .tang_ring-scene {
    width: 200px;
    height: 200px;
    perspective: 600px;
    margin: 30px;
  }
  .tang_ring {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    animation: tang_ring-spin 8s linear infinite;
  }
  .tang_ring-item {
    position: absolute;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: 3px solid #e66a3d;
    background: rgba(230, 106, 61, 0.15);
  }
  .tang_ring-item:nth-child(1) { transform: rotateY(0deg) translateZ(80px); }
  .tang_ring-item:nth-child(2) { transform: rotateY(60deg) translateZ(80px); }
  .tang_ring-item:nth-child(3) { transform: rotateY(120deg) translateZ(80px); }
  .tang_ring-item:nth-child(4) { transform: rotateY(180deg) translateZ(80px); }
  .tang_ring-item:nth-child(5) { transform: rotateY(240deg) translateZ(80px); }
  .tang_ring-item:nth-child(6) { transform: rotateY(300deg) translateZ(80px); }

  @keyframes tang_ring-spin {
    from { transform: rotateX(-20deg) rotateY(0deg); }
    to   { transform: rotateX(-20deg) rotateY(360deg); }
  }

  .tang_container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
  }
  .tang_label { margin-top: 10px; font-size: 14px; color: #aaa; }
</style>
</head>
<body class="tang_body">
<h1 class="tang_h1">CSS3 3D 动画</h1>
<div class="tang_container">
  <div>
    <div class="tang_scene">
      <div class="tang_cube">
        <div class="tang_face tang_front">前</div>
        <div class="tang_face tang_back">后</div>
        <div class="tang_face tang_right">右</div>
        <div class="tang_face tang_left">左</div>
        <div class="tang_face tang_top">上</div>
        <div class="tang_face tang_bottom">下</div>
      </div>
    </div>
    <p class="tang_label">3D 立方体旋转</p>
  </div>

  <div>
    <div class="tang_card-scene">
      <div class="tang_card">
        <div class="tang_card-face tang_card-front">正面<br>悬停翻转</div>
        <div class="tang_card-face tang_card-back">背面<br>3D 翻转</div>
      </div>
    </div>
    <p class="tang-label">3D 卡片翻转（悬停）</p>
  </div>

  <div>
    <div class="tang_ring-scene">
      <div class="tang_ring">
        <div class="tang_ring-item"></div>
        <div class="tang_ring-item"></div>
        <div class="tang_ring-item"></div>
        <div class="tang_ring-item"></div>
        <div class="tang_ring-item"></div>
        <div class="tang_ring-item"></div>
      </div>
    </div>
    <p class="tang-label">3D 圆环旋转</p>
  </div>
</div>
</body>
</html>
