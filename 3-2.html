<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24001010303 唐翊斌</title>
    <style>
        p{
            color: #36d;
            font-size: 50px;
        }
        /* 标签选择器 */
        #box{
            width: 600px;
            height: 500px;
            background-color: #ccc;
        }
        .n1{
            color: #aaa;
        }
        .n2{
            color: #ddd;
        }
        .n3{
            color: #000;
        }
        h2{
            background-color: #000;
            color: #fff;
        }
        .n4{
            color: #fff;
        }
        .small-box{
            width: 300px;
            height: 300px;
            background-color: #6cf;
        }

    </style>
</head>
<body>
    <h2>重叠样式表CCS</h2>
    <div id="box">
        <p>css<span class="n4">选择器</span></p>
        <p><span class = "n1">唐</span><span class="n2">翊</span><span class="n3">斌</span></p>
        <p>CSS属性</p>
    </div>
    <div class="small-box"></div>

</html>
