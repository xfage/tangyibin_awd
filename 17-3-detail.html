<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17-3 商品详情（fetch）</title>
    <!-- 作者：唐翊斌，建立时间：2026-11-02 13:15，使用模型：Hy3，功能名称：fetch 根据 ID 获取单个商品详情并展示 -->
    <link rel="stylesheet" href="fonts/iconfont.css">
    <style>
        :root {
            --ink: #17232b;
            --muted: #617078;
            --paper: #f4f7fa;
            --card: #ffffff;
            --line: #e1e7ee;
            --blue: #215a70;
            --orange: #e66a3d;
            --green: #3f8e8c;
            --purple: #8e6c9c;
            --shadow: 0 14px 34px rgba(28, 39, 43, .08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh; color: var(--ink); background: var(--paper);
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif; line-height: 1.65;
        }
        .tang_shell { width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: 30px 0 60px; }
        .tang_head { display: flex; align-items: center; gap: 16px; margin-bottom: 6px; }
        .tang_head .tang_logo {
            display: grid; place-items: center; width: 54px; height: 54px; border-radius: 14px;
            color: #fff; font-size: 26px; background: linear-gradient(135deg, var(--orange), var(--blue));
            box-shadow: var(--shadow);
        }
        .tang_head h1 { font-size: 28px; }
        .tang_head p { color: var(--muted); font-size: 14px; }
        .tang_tip {
            margin: 18px 0 26px; padding: 14px 18px; border-radius: 10px;
            background: #fdeee7; border-left: 4px solid var(--orange); font-size: 14px; color: #2c3e46;
        }
        .tang_tip b { color: var(--orange); }
        .tang_tip code { font-family: Consolas, monospace; background: #fbe3d8; padding: 1px 6px; border-radius: 5px; }

        .tang_toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
        .tang_btn {
            background: var(--orange); color: #fff; border: none; border-radius: 8px;
            padding: 10px 22px; font-family: inherit; font-size: 15px; cursor: pointer;
            display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
        }
        .tang_btn:hover { background: #cf5a2f; }
        .tang_status { font-size: 14px; font-weight: 700; padding: 4px 12px; border-radius: 20px; }
        .tang_status_loading { background: #fff3d6; color: #b5651d; }
        .tang_status_ok { background: #e3f3ed; color: var(--green); }
        .tang_status_err { background: #fbe3df; color: #c0392b; }

        .tang_detail {
            display: grid; grid-template-columns: 360px 1fr; gap: 28px; align-items: start;
            background: var(--card); border: 1px solid var(--line); border-radius: 16px;
            box-shadow: var(--shadow); padding: 26px;
        }
        .tang_gallery { display: grid; gap: 12px; }
        .tang_main_img {
            width: 100%; aspect-ratio: 1 / 1; background: linear-gradient(135deg, #eef3f7, #f7f4fb);
            border-radius: 12px; overflow: hidden; display: grid; place-items: center;
        }
        .tang_main_img img { width: 100%; height: 100%; object-fit: contain; }
        .tang_thumbs { display: flex; gap: 10px; flex-wrap: wrap; }
        .tang_thumb {
            width: 62px; height: 62px; border-radius: 10px; overflow: hidden; cursor: pointer;
            border: 2px solid var(--line); background: #f3f6f9;
        }
        .tang_thumb img { width: 100%; height: 100%; object-fit: contain; }
        .tang_thumb.tang_active { border-color: var(--orange); }

        .tang_info h2 { font-size: 26px; line-height: 1.3; margin-bottom: 8px; }
        .tang_sub { color: var(--muted); font-size: 14px; display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
        .tang_sub span { display: inline-flex; align-items: center; gap: 5px; }
        .tang_sub i { color: var(--orange); }
        .tang_price_row { display: flex; align-items: baseline; gap: 16px; margin: 6px 0 18px; }
        .tang_price { color: var(--orange); font-weight: 800; font-size: 32px; }
        .tang_discount { color: var(--green); font-size: 13px; font-weight: 700; }
        .tang_desc { font-size: 15px; color: #2c3e46; line-height: 1.8; border-top: 1px dashed var(--line); padding-top: 16px; }
        .tang_spec { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 20px; margin-top: 16px; }
        .tang_spec_item { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid #eef2f6; font-size: 14px; }
        .tang_spec_item .tang_k { color: var(--muted); }
        .tang_spec_item .tang_v { font-weight: 700; }

        .tang_loading, .tang_error {
            background: var(--card); border: 1px solid var(--line); border-radius: 16px;
            box-shadow: var(--shadow); padding: 50px; text-align: center; color: var(--muted);
        }
        .tang_error { color: #c0392b; }

        .tang_back { display: inline-block; margin-top: 40px; color: var(--orange); text-decoration: none; font-size: 15px; }
        .tang_back:hover { text-decoration: underline; }
        .tang_foot { margin-top: 22px; color: var(--muted); font-size: 12px; }

        @media (max-width: 820px) {
            .tang_detail { grid-template-columns: 1fr; }
            .tang_shell { width: calc(100% - 28px); }
        }
    </style>
</head>
<body>
    <div class="tang_shell">
        <div class="tang_head">
            <div class="tang_logo"><i class="iconfont">&#xe63e;</i></div>
            <div>
                <h1>商品详情</h1>
                <p>根据列表页传来的 <code style="font-family:Consolas,monospace">id</code>，用 <code style="font-family:Consolas,monospace">fetch()</code> 拉取单个商品</p>
            </div>
        </div>

        <div class="tang_tip">
            <b>怎么玩：</b>页面从网址 <code>?id=数字</code> 读出商品 ID，再请求
            <code>https://dummyjson.com/products/{id}</code> 拿到该商品的全部信息（图片、价格、描述、库存等）并展示。
            若网址没带 id，则默认取 <b>id = 1</b>。
        </div>

        <div class="tang_toolbar">
            <a class="tang_btn" href="17-3.html"><i class="iconfont">&#xe64c;</i>返回列表</a>
            <button class="tang_btn" id="tang_btn_reload" type="button"><i class="iconfont">&#xe6bb;</i>重新加载</button>
            <span class="tang_status tang_status_loading" id="tang_status" style="display:none;">请求中…</span>
        </div>

        <div id="tang_content">
            <div class="tang_loading">加载中…</div>
        </div>

        <a class="tang_back" href="index.html">← 返回首页</a>
        <div class="tang_foot">唐翊斌 · 高级网页设计课堂实践 · No CDN</div>
    </div>

    <script>
        var tang_content = document.getElementById("tang_content");
        var tang_status = document.getElementById("tang_status");
        var tang_btn = document.getElementById("tang_btn_reload");

        function tang_getId() {
            var params = new URLSearchParams(window.location.search);
            var id = parseInt(params.get("id"), 10);
            if (isNaN(id)) id = 1;
            return id;
        }

        function tang_escape(s) {
            return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function tang_setStatus(text, cls) {
            tang_status.style.display = "inline-block";
            tang_status.className = "tang_status " + cls;
            tang_status.textContent = text;
        }

        function tang_render(p) {
            var imgs = (p.images && p.images.length) ? p.images : [p.thumbnail];
            var mainImg = imgs[0];
            var rating = (typeof p.rating === "number") ? p.rating.toFixed(1) : p.rating;
            var thumbsHtml = imgs.map(function (src, i) {
                return '<div class="tang_thumb' + (i === 0 ? " tang_active" : "") + '" data-src="' + tang_escape(src) + '">' +
                    '<img src="' + tang_escape(src) + '" alt="缩略图' + i + '" loading="lazy"></div>';
            }).join("");

            tang_content.innerHTML =
                '<div class="tang_detail">' +
                    '<div class="tang_gallery">' +
                        '<div class="tang_main_img"><img id="tang_main_img" src="' + tang_escape(mainImg) + '" alt="' + tang_escape(p.title) + '"></div>' +
                        '<div class="tang_thumbs">' + thumbsHtml + '</div>' +
                    '</div>' +
                    '<div class="tang_info">' +
                        '<h2>' + tang_escape(p.title) + '</h2>' +
                        '<div class="tang_sub">' +
                            '<span><i class="iconfont">&#xe61e;</i>品牌：' + tang_escape(p.brand || "—") + '</span>' +
                            '<span><i class="iconfont">&#xeaf9;</i>分类：' + tang_escape(p.category || "—") + '</span>' +
                            '<span><i class="iconfont">&#xe8c3;</i>评分：' + tang_escape(rating) + '</span>' +
                        '</div>' +
                        '<div class="tang_price_row">' +
                            '<span class="tang_price">$' + tang_escape(p.price) + '</span>' +
                            (p.discountPercentage ? '<span class="tang_discount">限时 ' + tang_escape(Math.round(p.discountPercentage)) + '% off</span>' : '') +
                        '</div>' +
                        '<div class="tang_desc">' + tang_escape(p.description) + '</div>' +
                        '<div class="tang_spec">' +
                            tang_specItem("商品 ID", "#" + tang_escape(p.id)) +
                            tang_specItem("库存", tang_escape(p.stock)) +
                            tang_specItem("最低订购", tang_escape(p.minimumOrderQuantity || "—")) +
                            tang_specItem("是否免邮", p.shippingInformation ? tang_escape(p.shippingInformation) : "—") +
                            tang_specItem("退换政策", p.returnPolicy ? tang_escape(p.returnPolicy) : "—") +
                            tang_specItem("保修", p.warrantyInformation ? tang_escape(p.warrantyInformation) : "—") +
                        '</div>' +
                    '</div>' +
                '</div>';

            // 缩略图切换大图
            document.querySelectorAll(".tang_thumb").forEach(function (th) {
                th.addEventListener("click", function () {
                    document.getElementById("tang_main_img").src = th.getAttribute("data-src");
                    document.querySelectorAll(".tang_thumb").forEach(function (t) { t.classList.remove("tang_active"); });
                    th.classList.add("tang_active");
                });
            });
        }

        function tang_specItem(k, v) {
            return '<div class="tang_spec_item"><span class="tang_k">' + k + '</span><span class="tang_v">' + v + '</span></div>';
        }

        function tang_load() {
            var id = tang_getId();
            tang_btn.disabled = true;
            tang_setStatus("请求中…", "tang_status_loading");
            tang_content.innerHTML = '<div class="tang_loading">加载中（id = ' + id + '）…</div>';

            fetch("https://dummyjson.com/products/" + id)
                .then(function (res) {
                    if (!res.ok) throw new Error("HTTP 状态：" + res.status);
                    return res.json();
                })
                .then(function (data) {
                    if (data && data.id) {
                        tang_render(data);
                        tang_setStatus("✓ 加载成功", "tang_status_ok");
                    } else {
                        throw new Error("未找到该商品");
                    }
                    tang_btn.disabled = false;
                })
                .catch(function (err) {
                    tang_setStatus("✗ 请求失败", "tang_status_err");
                    tang_content.innerHTML = '<div class="tang_error">出错了：' + tang_escape(err.message) + '<br><br><a class="tang_btn" href="17-3.html">← 返回列表</a></div>';
                    tang_btn.disabled = false;
                });
        }

        tang_btn.addEventListener("click", tang_load);
        tang_load();
    </script>
</body>
</html>
