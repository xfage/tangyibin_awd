<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10-4 媒体查询布局</title>
    <style>
        /* 重置默认样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 根元素字体大小，作为rem基准 */
        html {
            font-size: 16px;
        }

        body {
            min-width: 320px;
            padding: 1.25rem;
            background-color: #ecf0f1;
            font-family: "Microsoft YaHei", sans-serif;
        }

        /* 页面标题 */
        .title {
            text-align: center;
            font-size: 2rem;
            color: #2c3e50;
            margin-bottom: 1.5rem;
            letter-spacing: 0.5rem;
        }

        /* 盒子容器 - flex布局 */
        .box-container {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }

        /* 盒子基础样式 */
        .box {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            padding: 1.5rem 1rem;
            text-align: center;
            border-radius: 0.5rem;
            font-size: 1.125rem;
            font-weight: bold;
            box-shadow: 0 0.25rem 0.75rem rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .box:hover {
            transform: translateY(-0.375rem);
            box-shadow: 0 0.5rem 1.25rem rgba(0, 0, 0, 0.25);
        }

        /* ==================== 媒体查询布局（四个断点） ==================== */

        /* 小屏幕 320px ~ 575px → 2列 */
        @media (min-width: 320px) and (max-width: 575px) {
            html {
                font-size: 13px;
            }
            .box {
                flex: 0 0 calc(50% - 0.5rem);
            }
        }

        /* 中等屏幕 576px ~ 767px → 3列 */
        @media (min-width: 576px) and (max-width: 767px) {
            html {
                font-size: 14px;
            }
            .box {
                flex: 0 0 calc(33.333% - 0.667rem);
            }
        }

        /* 大屏幕 768px ~ 1023px → 4列 */
        @media (min-width: 768px) and (max-width: 1023px) {
            html {
                font-size: 15px;
            }
            .box {
                flex: 0 0 calc(25% - 0.75rem);
            }
        }

        /* 超大屏幕 >= 1024px → 8列 */
        @media (min-width: 1024px) {
            html {
                font-size: 16px;
            }
            .box {
                flex: 0 0 calc(12.5% - 0.875rem);
            }
        }
    </style>
</head>
<body>
    <h1 class="title">唐翊斌</h1>
    <div class="box-container">
        <div class="box">盒子 1</div>
        <div class="box">盒子 2</div>
        <div class="box">盒子 3</div>
        <div class="box">盒子 4</div>
        <div class="box">盒子 5</div>
        <div class="box">盒子 6</div>
        <div class="box">盒子 7</div>
        <div class="box">盒子 8</div>
    </div>
</body>
</html>
