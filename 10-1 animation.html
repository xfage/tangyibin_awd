<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS动画 - 背景颜色变化</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            background-color: #f5f5f5;
            font-family: sans-serif;
        }

        .box {
            position: fixed;
            top: 50%;
            left: 50%;
            width: min(240px, 45vw, 45vh);
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 16px;
            color: #fff;
            font-size: 24px;
            text-align: center;
            animation: color-change 8s ease-in-out infinite;
        }

        @keyframes color-change {
            0%, 100% {
                background-color: #e74c3c;
                transform: translate(-50%, -50%) translate(-20vw, -20vh);
            }
            25% {
                background-color: #f39c12;
                transform: translate(-50%, -50%) translate(20vw, -20vh);
            }
            50% {
                background-color: #2ecc71;
                transform: translate(-50%, -50%) translate(20vw, 20vh);
            }
            75% {
                background-color: #3498db;
                transform: translate(-50%, -50%) translate(-20vw, 20vh);
            }
        }
    </style>
</head>
<body>
    <div class="box">唐翊斌</div>
</body>
</html>
