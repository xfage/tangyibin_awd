<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>幻灯片 - 唐翊斌</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: #050505;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* 背景光晕 */
  .glow-1 {
    position: fixed;
    top: -200px;
    left: -100px;
    width: 600px;
    height: 600px;
    background: rgba(99, 102, 241, 0.15);
    border-radius: 50%;
    filter: blur(120px);
    pointer-events: none;
  }
  .glow-2 {
    position: fixed;
    bottom: -200px;
    right: -100px;
    width: 500px;
    height: 500px;
    background: rgba(168, 85, 247, 0.12);
    border-radius: 50%;
    filter: blur(100px);
    pointer-events: none;
  }

  .slideshow-wrapper {
    position: relative;
    z-index: 1;
    width: 90%;
    max-width: 960px;
  }

  .slideshow {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 10;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.36);
  }

  .slides-track {
    display: flex;
    height: 100%;
    animation: slideTrack 15s ease-in-out infinite;
  }

  .slide {
    width: 100%;
    min-width: 100%;
    height: 100%;
    flex-shrink: 0;
    position: relative;
  }

  /* 图片铺满整张幻灯片 */
  .slide-image {
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  .slide-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    animation: kenBurns 15s ease-in-out infinite;
  }

  /* ★ 文字浮在图片上：黑底白字 + 透明背景 */
  .slide-text {
    position: absolute;
    bottom: 24px;
    left: 24px;
    right: 24px;
    padding: 20px 24px;
    /* 半透明黑色背景 */
    background: rgba(0, 0, 0, 0.65);
    /* 毛玻璃效果（可选增强可读性） */
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.06);
    z-index: 2;
  }

  .slide-tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    /* 标签用紫色点缀 */
    color: #a855f7;
    background: rgba(168, 85, 247, 0.15);
    border: 1px solid rgba(168, 85, 247, 0.25);
    padding: 3px 10px;
    border-radius: 9999px;
    margin-bottom: 10px;
  }

  /* ★ 纯白标题 */
  .slide-title {
    font-size: 22px;
    font-weight: 600;
    line-height: 1.3;
    letter-spacing: -0.025em;
    color: #ffffff;
    margin-bottom: 6px;
  }

  /* ★ 浅白描述文字 */
  .slide-desc {
    font-size: 13px;
    font-weight: 300;
    line-height: 1.6;
    color: rgba(255, 255, 255, 0.72);
  }

  /* ★ 作者署名：白字 */
  .slide-author {
    margin-top: 10px;
    font-size: 11px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.5);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .slide-author .dot {
    width: 5px;
    height: 5px;
    background: #a855f7;
    border-radius: 50%;
    animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
  }

  /* ========== 轮播关键帧 ========== */
  @keyframes slideTrack {
    0%        { transform: translateX(0); }
    32%       { transform: translateX(0); }
    35%       { transform: translateX(-100%); }
    65%       { transform: translateX(-100%); }
    68%       { transform: translateX(-200%); }
    98%       { transform: translateX(-200%); }
    100%      { transform: translateX(0); }
  }

  @keyframes kenBurns {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.05); }
    100% { transform: scale(1); }
  }

  /* ========== 指示器 ========== */
  .indicators {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 24px;
  }

  .indicator {
    width: 32px;
    height: 4px;
    border-radius: 9999px;
    background: rgba(255, 255, 255, 0.1);
    position: relative;
    overflow: hidden;
  }

  .indicator::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: 0%;
    border-radius: 9999px;
    background: linear-gradient(to right, #6366f1, #a855f7);
  }

  .indicator:nth-child(1)::after {
    animation: indicatorFill 15s ease-in-out infinite;
    animation-delay: 0s;
  }
  .indicator:nth-child(2)::after {
    animation: indicatorFill 15s ease-in-out infinite;
    animation-delay: -5s;
  }
  .indicator:nth-child(3)::after {
    animation: indicatorFill 15s ease-in-out infinite;
    animation-delay: -10s;
  }

  @keyframes indicatorFill {
    0%   { width: 0%; }
    32%  { width: 100%; }
    35%  { width: 0%; }
    65%  { width: 100%; }
    68%  { width: 0%; }
    98%  { width: 100%; }
    100% { width: 0%; }
  }

  /* ========== 页面标题 ========== */
  .page-header {
    position: relative;
    z-index: 1;
    text-align: center;
    margin-bottom: 40px;
  }

  .page-header h1 {
    font-size: 36px;
    font-weight: 600;
    letter-spacing: -0.025em;
    background: linear-gradient(to right, #a855f7, #6366f1);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }

  .page-header p {
    font-size: 14px;
    font-weight: 300;
    color: rgb(107, 114, 128);
  }

  .page-footer {
    position: relative;
    z-index: 1;
    text-align: center;
    margin-top: 32px;
    font-size: 12px;
    color: rgb(75, 85, 99);
  }

  .page-footer .name {
    color: #a855f7;
    font-weight: 500;
  }

  .noise-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: url('https://grainy-gradients.vercel.app/noise.svg');
    opacity: 0.15;
    mix-blend-mode: overlay;
    pointer-events: none;
    z-index: 999;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  @media (max-width: 640px) {
    .page-header h1 { font-size: 28px; }
    .slide-title { font-size: 17px; }
    .slide-desc { font-size: 12px; }
    .slide-text { padding: 14px 18px; bottom: 16px; left: 16px; right: 16px; }
  }
</style>
</head>
<body>

  <div class="glow-1"></div>
  <div class="glow-2"></div>
  <div class="noise-overlay"></div>

  <div class="page-header">
    <h1>唐翊斌</h1>
    <p>影像与文字的交织</p>
  </div>

  <div class="slideshow-wrapper">
    <div class="slideshow">
      <div class="slides-track">

        <!-- 幻灯片 1 -->
        <div class="slide">
          <div class="slide-image">
            <img src="img/4.webp" alt="幻灯片 1">
          </div>
          <div class="slide-text">
            <span class="slide-tag">第一章</span>
            <div class="slide-title">光影之间</div>
            <div class="slide-desc">在光与影的交汇处，时间仿佛凝固，每一帧都是对瞬间的永恒捕捉。</div>
            <div class="slide-author"><span class="dot"></span> 唐翊斌</div>
          </div>
        </div>

        <!-- 幻灯片 2 -->
        <div class="slide">
          <div class="slide-image">
            <img src="img/5.webp" alt="幻灯片 2">
          </div>
          <div class="slide-text">
            <span class="slide-tag">第二章</span>
            <div class="slide-title">静谧之声</div>
            <div class="slide-desc">沉默并非空洞，而是最深沉的叙述——在无声中倾听世界的呼吸。</div>
            <div class="slide-author"><span class="dot"></span> 唐翊斌</div>
          </div>
        </div>

        <!-- 幻灯片 3 -->
        <div class="slide">
          <div class="slide-image">
            <img src="img/6.webp" alt="幻灯片 3">
          </div>
          <div class="slide-text">
            <span class="slide-tag">第三章</span>
            <div class="slide-title">远方回响</div>
            <div class="slide-desc">每一张画面都是一封寄往远方的信，等待被某个灵魂温柔地拆开。</div>
            <div class="slide-author"><span class="dot"></span> 唐翊斌</div>
          </div>
        </div>

      </div>
    </div>

    <div class="indicators">
      <div class="indicator"></div>
      <div class="indicator"></div>
      <div class="indicator"></div>
    </div>
  </div>

  <div class="page-footer">
    由 <span class="name">唐翊斌</span> 设计 · CSS Animation 驱动
  </div>

</body>
</html>
