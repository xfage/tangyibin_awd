<!DOCTYPE html>
<html lang="en">
<link>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24001010303 tyb</title>
    <style>
        p {
            color: #f00;
            font-size: 100px;
        }
        .text{
            color: green;
        }
        #text{
            /* 优先级：id>class>标签 */
            color: purple;
        }
        .box p{
            color: orange;
        }
        #box #text{
            color: silver;
        }
        .text{
            color: yellow!important;
            /* hack,可覆盖内嵌css */
        }
         #box{
            /* 宽400，高400，灰色背景，距离，字间距5px */
            width: 1400px;
            height: 500px;
            background-color: grey;
            margin: 10px;
            padding: 10px;
            letter-spacing: 5px;
            /* 圆角矩形50% */
            border-radius: 10px;

         }
    </style>
    <link rel="stylesheet" href="css.css"></link>
    <!-- 后定义的覆盖前定义的 -->

</head>
<body>
    <h2>层叠与继承</h2>
    <div id="box" class="box">
        <p id="text" class="text">24001010303 唐翊斌</p>
        <p>层叠与继承的优先级</p>
    </div>
</body>
</html>
