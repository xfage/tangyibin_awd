<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24001010303 唐翊斌</title>
    <style>
        .flex{
            /* 容器 */
            display: flex;
            /* 子元素在一行显示 */
            flex-wrap: wrap;
        }
        .flex li{
            /* 项目:item */
            /* float: left; */
            border: 1px solid #333;
            width: 49%;
            list-style: none;
            text-align: center;
            flex-grow: 1;
            display: flex;
        }
        .flex li:nth-child(1){
            align-items: center;
            justify-content: center;
        }
        .box{
            width: 50%;
            height: 50%;
            background-color: #f1f2f3
        }
    </style>
</head>
<body>
    <h2>唐翊斌 flex</h2>
    <ul class="flex">
        <li>
            <div class="box"></div>
        </li>

    </ul>
</body>
</html>
