<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>移动端导航 - SVG 图标</title>
    <script src="cdn/lucide/lucide.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #f5f5f5;
            padding-bottom: 56px;
            width: 100%;
        }

        .tang_mobile-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 44px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            font-weight: 600;
            border-bottom: 1px solid #eee;
            z-index: 100;
        }

        .tang_mobile-content {
            padding-top: 44px;
            width: 100%;
        }

        .tang_swiper {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, #ff6b35, #ff8c42);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
        }

        .tang_category {
            display: flex;
            padding: 12px;
            background: #fff;
            border-bottom: 1px solid #eee;
            overflow-x: auto;
        }

        .tang_category-item {
            flex-shrink: 0;
            padding: 6px 16px;
            margin-right: 8px;
            background: #f5f5f5;
            border-radius: 16px;
            font-size: 13px;
            color: #666;
            cursor: pointer;
        }

        .tang_category-item.active {
            background: #ff6b35;
            color: #fff;
        }

        .tang_product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            padding: 8px;
        }

        .tang_product-card {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .tang_product-image {
            width: 100%;
            height: 120px;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .tang_product-info {
            padding: 8px;
        }

        .tang_product-title {
            font-size: 14px;
            color: #333;
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .tang_product-desc {
            font-size: 12px;
            color: #999;
            margin-bottom: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .tang_product-price {
            font-size: 16px;
            color: #ff6b35;
            font-weight: bold;
        }

        .tang_product-price span {
            font-size: 12px;
        }

        .tang_tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: #fff;
            display: flex;
            border-top: 1px solid #eee;
            z-index: 100;
        }

        .tang_tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            transition: color 0.2s;
        }

        .tang_tab-item svg {
            width: 24px;
            height: 24px;
            color: #999;
            transition: color 0.2s;
        }

        .tang_tab-item .tang_tab-label {
            font-size: 10px;
            color: #999;
            margin-top: 2px;
            transition: color 0.2s;
        }

        .tang_tab-item.active svg,
        .tang_tab-item.active .tang_tab-label {
            color: #ff6b35;
        }

        .tang_tab-item .tang_badge {
            position: absolute;
            top: 4px;
            right: calc(50% - 20px);
            min-width: 16px;
            height: 16px;
            padding: 0 4px;
            background: #ff3b30;
            border-radius: 8px;
            font-size: 10px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-style: normal;
            line-height: 1;
        }

        .tang_tab-item .tang_dot {
            position: absolute;
            top: 6px;
            right: calc(50% - 16px);
            width: 8px;
            height: 8px;
            background: #ff3b30;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="tang_mobile-header">移动端商城</div>

    <div class="tang_mobile-content">
        <div class="tang_swiper">轮播图区域</div>

        <div class="tang_category">
            <div class="tang_category-item active">全部</div>
            <div class="tang_category-item">手机</div>
            <div class="tang_category-item">电脑</div>
            <div class="tang_category-item">耳机</div>
            <div class="tang_category-item">手表</div>
        </div>

        <div class="tang_product-grid">
            <div class="tang_product-card">
                <div class="tang_product-image">&#128241;</div>
                <div class="tang_product-info">
                    <div class="tang_product-title">iPhone 15 Pro</div>
                    <div class="tang_product-desc">苹果最新旗舰手机</div>
                    <div class="tang_product-price"><span>&#65509;</span>7999</div>
                </div>
            </div>
            <div class="tang_product-card">
                <div class="tang_product-image">&#128187;</div>
                <div class="tang_product-info">
                    <div class="tang_product-title">MacBook Air</div>
                    <div class="tang_product-desc">轻薄便携笔记本</div>
                    <div class="tang_product-price"><span>&#65509;</span>8999</div>
                </div>
            </div>
            <div class="tang_product-card">
                <div class="tang_product-image">&#127911;</div>
                <div class="tang_product-info">
                    <div class="tang_product-title">AirPods Pro</div>
                    <div class="tang_product-desc">主动降噪耳机</div>
                    <div class="tang_product-price"><span>&#65509;</span>1999</div>
                </div>
            </div>
            <div class="tang_product-card">
                <div class="tang_product-image">&#128337;</div>
                <div class="tang_product-info">
                    <div class="tang_product-title">Apple Watch</div>
                    <div class="tang_product-desc">智能运动手表</div>
                    <div class="tang_product-price"><span>&#65509;</span>2999</div>
                </div>
            </div>
            <div class="tang_product-card">
                <div class="tang_product-image">&#128241;</div>
                <div class="tang_product-info">
                    <div class="tang_product-title">iPad Pro</div>
                    <div class="tang_product-desc">平板电脑</div>
                    <div class="tang_product-price"><span>&#65509;</span>6999</div>
                </div>
            </div>
            <div class="tang_product-card">
                <div class="tang_product-image">&#127911;</div>
                <div class="tang_product-info">
                    <div class="tang_product-title">Sony WH-1000XM5</div>
                    <div class="tang_product-desc">头戴式降噪耳机</div>
                    <div class="tang_product-price"><span>&#65509;</span>2499</div>
                </div>
            </div>
            <div class="tang_product-card">
                <div class="tang_product-image">&#128187;</div>
                <div class="tang_product-info">
                    <div class="tang_product-title">Dell XPS 13</div>
                    <div class="tang_product-desc">超极本电脑</div>
                    <div class="tang_product-price"><span>&#65509;</span>9999</div>
                </div>
            </div>
            <div class="tang_product-card">
                <div class="tang_product-image">&#128337;</div>
                <div class="tang_product-info">
                    <div class="tang_product-title">Samsung Galaxy Watch</div>
                    <div class="tang_product-desc">智能手表</div>
                    <div class="tang_product-price"><span>&#65509;</span>2299</div>
                </div>
            </div>
        </div>
    </div>

    <nav class="tang_tab-bar">
        <div class="tang_tab-item active">
            <i data-lucide="home"></i>
            <span class="tang_tab-label">首页</span>
        </div>
        <div class="tang_tab-item">
            <i data-lucide="search"></i>
            <span class="tang_tab-label">搜索</span>
            <span class="tang_dot"></span>
        </div>
        <div class="tang_tab-item">
            <i data-lucide="shopping-cart"></i>
            <span class="tang_tab-label">购物车</span>
            <span class="tang_badge">5</span>
        </div>
        <div class="tang_tab-item">
            <i data-lucide="user"></i>
            <span class="tang_tab-label">用户</span>
        </div>
    </nav>

    <script>
        lucide.createIcons();

        document.querySelectorAll('.tang_tab-item').forEach(item => {
            item.addEventListener('click', function() {
                document.querySelectorAll('.tang_tab-item').forEach(i => i.classList.remove('active'));
                this.classList.add('active');
            });
        });

        document.querySelectorAll('.tang_category-item').forEach(item => {
            item.addEventListener('click', function() {
                document.querySelectorAll('.tang_category-item').forEach(i => i.classList.remove('active'));
                this.classList.add('active');
            });
        });
    </script>
</body>
</html>
